# Application dependencies, not an installable distribution yet.
# Install with: .\.venv\Scripts\python.exe -m pip install --group dev
[dependency-groups]
runtime = [
    "fastapi==0.163.0",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.3",
    "httpx==0.28.1",
    "pandas==3.1.1",
    "numpy==2.5.4",
    "openpyxl==3.1.5",
]
dev = [
    { include-group = "runtime" },
    "pytest==9.2.0",
    "ruff==0.17.5",
]

[tool.pytest.ini_options]
minversion = "9.2"
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]